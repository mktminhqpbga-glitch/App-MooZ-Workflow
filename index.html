<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#171819" />
    <title>MooZ CVN — Trung tâm điều khiển</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="vendor/mooz/canvas-image-editor.css" />
  </head>
  <body>
    <aside class="sidebar">
      <a class="brand" href="#home" aria-label="MooZ CVN trang chủ"
        ><span class="brand-mark">M</span
        ><span>MooZ CVN<span class="brand-sub">WORKFLOW STUDIO</span></span></a
      ><span class="nav-label">KHÔNG GIAN LÀM VIỆC</span>
      <nav id="nav" aria-label="Điều hướng chính"></nav>
      <div class="sidebar-bottom">
        <button data-route="settings" class="connection">
          <i></i><span>Kết nối AI<small>Chưa thiết lập</small></span
          ><span aria-hidden="true">›</span>
        </button>
        <p>MooZ CVN <span>Web · 01</span></p>
      </div>
    </aside>
    <div class="workspace">
      <header>
        <button
          id="mobileMenu"
          aria-label="Mở điều hướng"
          aria-expanded="false"
        >
          ☰
        </button>
        <div class="breadcrumb">
          Không gian làm việc <span>/</span>
          <strong id="crumb">Tổng quan</strong>
        </div>
        <div class="header-actions">
          <button
            data-route="appearance"
            class="icon-button"
            aria-label="Tùy chỉnh giao diện"
            title="Tùy chỉnh giao diện"
            id="appearanceIcon"
          ></button
          ><span class="avatar" aria-label="Không gian cá nhân">M</span>
        </div>
      </header>
      <main id="main" tabindex="-1"></main>
      <footer>
        <span>Một không gian cho mọi ý tưởng.</span
        ><span class="local-indicator">● Không gian cá nhân</span>
      </footer>
    </div>
    <div id="mobileBackdrop" hidden></div>
    <div id="toast" role="status" hidden></div>
    <script src="vendor/mooz/canvas-image-editor.js"></script>
    <script type="module" src="app.js"></script>
  </body>
</html>
