name: Native macOS build and verification
on:
  push:
    branches: [feat/native-macos]
    paths: ['native/**', '.github/workflows/native-macos.yml', '.github/scripts/native-check.py']
  pull_request:
    paths: ['native/**', '.github/workflows/native-macos.yml', '.github/scripts/native-check.py']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  companion:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: native/Tests/package-lock.json
      - run: python3 .github/scripts/native-check.py npm --prefix native/Tests ci --ignore-scripts
      - name: Verify standalone bundle checks
        run: python3 .github/scripts/native-check.py python3 -m unittest discover -s native/Tests -p 'test_*.py'
      - run: python3 .github/scripts/native-check.py npx --prefix native/Tests playwright install --with-deps chromium
      - name: Verify separate Chrome companion against fixture DOM
        run: |
          python3 .github/scripts/native-check.py node native/Tests/companion-worker.cjs
          CHROMIUM_PATH="$(node -p 'require("./native/Tests/node_modules/playwright").chromium.executablePath()')" python3 .github/scripts/native-check.py node native/Tests/companion.browser.cjs
  native:
    runs-on: macos-15-intel
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache/restore@v4
        id: media-cache
        with:
          path: ${{ runner.temp }}/mooz-media-ventura
          key: ventura-media-x86_64-${{ hashFiles('native/Tools/media-sources.json') }}-${{ hashFiles('native/Tools/build_media_macos.py') }}
          restore-keys: |
            ventura-media-x86_64-${{ hashFiles('native/Tools/media-sources.json') }}-
      - name: Native prerequisites
        run: |
          swift --version
          HOMEBREW_NO_AUTO_UPDATE=1 brew install pkgconf meson ninja nasm
      - name: Build pinned media tools for Intel Ventura 13
        env:
          MOOZ_MEDIA_BUILD_ROOT: ${{ runner.temp }}/mooz-media-ventura
        run: python3 .github/scripts/native-check.py python3 native/Tools/build_media_macos.py
      - uses: actions/cache/save@v4
        if: always() && steps.media-cache.outputs.cache-hit != 'true'
        with:
          path: ${{ runner.temp }}/mooz-media-ventura
          key: ventura-media-x86_64-${{ hashFiles('native/Tools/media-sources.json') }}-${{ hashFiles('native/Tools/build_media_macos.py') }}
      - name: Test and package native Swift app
        env:
          MACOSX_DEPLOYMENT_TARGET: '13.0'
          MOOZ_MAX_MINIMUM_MACOS: '13.0'
        run: python3 .github/scripts/native-check.py bash native/Tools/package-macos.sh
      - name: Verify app launch
        run: |
          export MOOZ_DATA_DIR="$RUNNER_TEMP/mooz-native-smoke"
          export MOOZ_SMOKE_OUTPUT="$GITHUB_WORKSPACE/native/artifacts"
          python3 .github/scripts/native-check.py native/artifacts/MooZ.app/Contents/MacOS/MooZ --smoke-test
      - uses: actions/upload-artifact@v4
        with:
          name: MooZ-native-macOS-Intel-test-build
          path: |
            native/artifacts/MooZ-Native-macOS-*.zip
            native/artifacts/MooZ-Connect-Native.zip
            native/artifacts/SHA256SUMS.txt
            native/artifacts/native-smoke.json
            native/artifacts/native-smoke.png
            native/artifacts/native-smoke-final.mp4
            native/artifacts/native-bundle-info.json
